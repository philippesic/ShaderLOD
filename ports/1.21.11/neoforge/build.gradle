def shaderlodReimaginedPrimeLegacySource = file("../../../src/main/java/com/pp/shaderlod/optimization/reimaginedprime").canonicalPath + File.separator
sourceSets.main.java.exclude { it.file.canonicalPath.startsWith(shaderlodReimaginedPrimeLegacySource) }

