def shaderlodSolasMergedLegacySource = file("../../../src/main/java/com/pp/shaderlod/optimization/solasmerged").canonicalPath + File.separator
sourceSets.main.java.exclude { it.file.canonicalPath.startsWith(shaderlodSolasMergedLegacySource) }

