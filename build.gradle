tasks.register('benchmarkAnalyze', JavaExec) {
    dependsOn tasks.named('devClientClasses')
    classpath = sourceSets.devClient.runtimeClasspath
    mainClass = 'com.pp.shaderlod.dev.BenchmarkAnalyze'
    if (project.hasProperty('benchmarkAnalysisRequest')) args project.property('benchmarkAnalysisRequest').toString()
}
tasks.named('jar') {
    from sourceSets.benchmarkCore.output
    from('LICENSE') { into 'META-INF'; rename { 'LICENSE.shaderlod' } }
}
idea { module { downloadSources = true } }

// Isolated packaged-main admission; existing lanes are unchanged.
if (project.hasProperty('packagedMainProfile')) {
    apply from: 'dev/logs/cross-shader-performance-r2/packaged-main-runtime-r1/parent/packaged-main.gradle'
}

// Modern Iris ShaderSupplier is not present on either MC1.21.1 legacy API.
def makeupShadowSupplierLegacyExcluded = file("src/main/java/com/pp/shaderlod/optimization/makeupshadow/mixin/ShadowSupplierMixin.java").canonicalPath
sourceSets.main.java.exclude { it.file.canonicalPath == makeupShadowSupplierLegacyExcluded }

// Pinned native draw replacement is compiled only for this NeoForge 1.21.1 module.
sourceSets.main.java.srcDir("src/neoforge1211/java")
