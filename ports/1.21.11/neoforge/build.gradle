def shaderlodUnboundEarlyAlphaLegacySource = file("../../../src/main/java/com/pp/shaderlod/optimization/unboundearlyalpha").canonicalPath + File.separator
sourceSets.main.java.exclude { it.file.canonicalPath.startsWith(shaderlodUnboundEarlyAlphaLegacySource) }

