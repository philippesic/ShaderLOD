def shaderlodBslEarlyAlphaLegacySource = file("../../../src/main/java/com/pp/shaderlod/optimization/bslearlyalpha").canonicalPath + File.separator
sourceSets.main.java.exclude { it.file.canonicalPath.startsWith(shaderlodBslEarlyAlphaLegacySource) }

