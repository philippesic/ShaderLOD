sourceSets.main.java.exclude { it.file.canonicalPath.startsWith(file("../../../src/main/java/com/pp/shaderlod/optimization/sildurprime").canonicalPath + File.separator) }

// Bliss depth priming has explicit loader-local MC1.21.1 implementations.
def shaderlodBlissPrimeLegacySource = file("../../../src/main/java/com/pp/shaderlod/optimization/blissprime").canonicalPath + File.separator
sourceSets.main.java.exclude { it.file.canonicalPath.startsWith(shaderlodBlissPrimeLegacySource) }

// Modern Minecraft moved the effective FPS limiter out of Window.
// Select the port-local measurement ABI without changing timing admission.
def shaderlodLegacyVideoPins = [
 file('../../../src/main/java/com/pp/shaderlod/measurement/TimingVideoSettings.java').canonicalPath,
 file('../../../src/main/java/com/pp/shaderlod/measurement/MeasurementPins.java').canonicalPath
]
sourceSets.main.java.exclude { shaderlodLegacyVideoPins.contains(it.file.canonicalPath) }

// The pinned MC1.21.1 native sampler callbacks are absent from modern mixin configs.
// Keep their source and test out until the corresponding modern renderer owner is ported.
def shaderlodLegacySamplerRoot = file('../../../src/main/java/com/pp/shaderlod/optimization').canonicalPath + File.separator
sourceSets.main.java.exclude {
    it.file.canonicalPath.startsWith(shaderlodLegacySamplerRoot + 'complementarysampler' + File.separator) ||
        (it.file.canonicalPath.startsWith(shaderlodLegacySamplerRoot + 'makeupshadow' + File.separator + 'mixin' + File.separator) &&
            it.file.name.startsWith('SamplerPass') && it.file.name.endsWith('Mixin.java'))
}
sourceSets.test.java.exclude('com/pp/shaderlod/optimization/ComplementarySamplerPassTest.java')

// Root-only executable receipt proof; these loaders retain normal reload behavior.
def shaderlodRootApplySpecialization = file("../../../src/main/java/com/pp/shaderlod/optimization").canonicalPath + File.separator
sourceSets.main.java.exclude { detail ->
    def path = detail.file.canonicalPath
    path == shaderlodRootApplySpecialization + "NativeCpuApplyProof.java" ||
    path == shaderlodRootApplySpecialization + "NativeCpuGraphIdentity.java"
}

// Keep the root native-chain bootstrap gate out of other renderer ABIs.
sourceSets.main.java.exclude { it.file.canonicalPath == file("../../../src/main/java/com/pp/shaderlod/optimization/nativechain/NativeChainAdmission.java").canonicalPath }

// Shared, pinned source loading observer; source proofs are published with the actual pipeline.
tasks.named('processResources') { from('../../../src/main/resources') { include 'shaderlod-source-lifecycle.mixins.json' } }

// Shared neutral measurement clocks moved out of the production main source tree.
sourceSets.main.java.srcDir("../../../src/benchmarkCore/java")
sourceSets.main.java.exclude("com/pp/shaderlod/benchmark/core/**")
