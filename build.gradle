// Runtime directories own DH; never silently move a user's mod files to change a benchmark.
['runClientLodOn', 'runClientLodOff'].each { taskName ->
    def defaultDirectory = taskName == 'runClientLodOn' ? 'run-landscape/lod-on' : 'run-landscape/lod-off'
    def profile = file(project.findProperty('runDirectory')?.toString() ?: defaultDirectory)
    def dhFilename = runtimeLock.artifacts.distanthorizons.filename
    def dhJar = new File(profile, "mods/${dhFilename}")
    def expectedDh = project.findProperty('includeDh')?.toString() != 'false'
    def backgroundLaunch = project.findProperty('backgroundLaunch')?.toString() ?: System.getProperty('os.name').startsWith('Mac').toString()
    tasks.named(taskName).configure {
        doFirst {
            if (backgroundLaunch == 'true') {
                def options = new File(profile, 'options.txt')
                if (!options.isFile() || !(options.getText('UTF-8') =~ /(?m)^fullscreen:false\s*$/).find()) {
                    throw new GradleException('Background launch requires fullscreen:false; use scripts/dev_client.py to back up and prepare this profile before launch')
                }
                def loaderConfig = new File(profile, 'config/fml.toml')
                if (!loaderConfig.isFile() || !(loaderConfig.getText('UTF-8') =~ /(?m)^earlyWindowControl\s*=\s*false\s*$/).find()) {
                    throw new GradleException('Background launch requires earlyWindowControl=false; use scripts/dev_client.py to back up and prepare this profile before launch')
                }
            }
            if (dhJar.exists() != expectedDh) throw new GradleException("DH presence disagrees with includeDh=${expectedDh} in ${profile}")
            if (new File(profile, 'mods').exists()) {
                def unmanaged = new File(profile, 'mods').listFiles().findAll { it.name.endsWith('.jar') && it.name != dhFilename }
                if (!unmanaged.empty) throw new GradleException("Unmanaged profile mod jars would contaminate performanceStack=${performanceStack}: ${unmanaged*.name}")
            }
        }
    }
}
