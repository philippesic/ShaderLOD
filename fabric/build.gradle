plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id
base { archivesName = 'shaderlod-fabric' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets { devClient }
sourceSets.devClient.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
sourceSets.devClient.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // Release IDs are immutable; checksummed artifacts recorded in dependencies.lock.json.
    modImplementation 'maven.modrinth:iris:zsoi0dso'
    modImplementation 'maven.modrinth:sodium:u1OEbNKx'
    // Loom removes Iris's nested-JAR discovery metadata in its dev remap. Match every
    // bundled non-mod library from the pinned release, without CLI/tool transitives.
    runtimeOnly('org.antlr:antlr4-runtime:4.13.1') { transitive = false }
    runtimeOnly('io.github.douira:glsl-transformer:2.0.1') { transitive = false }
    runtimeOnly('org.anarres:jcpp:1.4.14') { transitive = false }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Compile the same source files, without copying policies or importing NeoForge.
def shared = ['com/pp/shaderlod/GeometryLodPolicy.java', 'com/pp/shaderlod/GeometryCoverageGuard.java', 'com/pp/shaderlod/optimization/**', 'com/pp/shaderlod/measurement/**', 'com/pp/shaderlod/CoreUniformFrame.java', 'com/pp/shaderlod/LodSettings.java',
              'com/pp/shaderlod/LodPreset.java', 'com/pp/shaderlod/EffectUniformFrame.java',
              'com/pp/shaderlod/lod/**', 'com/pp/shaderlod/integration/**', 'com/pp/shaderlod/packs/**',
              'com/pp/shaderlod/mixin/BslAo*.java',
              'com/pp/shaderlod/mixin/EffectUniformsMixin.java',
              'com/pp/shaderlod/mixin/IrisWorldCompletionMixin.java',
              'com/pp/shaderlod/mixin/IrisOptionWriteMixin.java']
sourceSets.main.java {
    srcDir '../src/main/java'
    include shared
    include 'com/pp/shaderlod/fabric/**'
    include 'com/pp/shaderlod/ShaderLodEffectConfig.java'
    // Same FQN loader adapter lives in this module; exclude the NeoForge original by path.
    exclude { it.file.canonicalPath == file('../src/main/java/com/pp/shaderlod/ShaderLodEffectConfig.java').canonicalPath }
    // Renderer bootstrap and live loader/config adapter have explicit Fabric pins.
    exclude { it.file.canonicalPath == file('../src/main/java/com/pp/shaderlod/integration/makeupquad/MakeUpQuadRuntime.java').canonicalPath }
    exclude { it.file.canonicalPath == file('../src/main/java/com/pp/shaderlod/integration/makeupquad/MakeUpQuadApiPins.java').canonicalPath }
    exclude { it.file.canonicalPath == file('../src/main/java/com/pp/shaderlod/integration/RasterExperimentRuntime.java').canonicalPath }
}
sourceSets.test.java {
    srcDir '../src/test/java'
    include 'com/pp/shaderlod/fabric/**'
    include 'com/pp/shaderlod/optimization/**'; include 'com/pp/shaderlod/measurement/**'; include 'com/pp/shaderlod/CoreUniformFrameTest.java'
    include 'com/pp/shaderlod/LodSettingsTest.java'
    include 'com/pp/shaderlod/lod/**'
    include 'com/pp/shaderlod/packs/**'
}

loom {
    accessWidenerPath = file("src/main/resources/shaderlod.accesswidener")
    mods {
        shaderlod { sourceSet sourceSets.main }
        shaderlod_dev { sourceSet sourceSets.devClient }
    }
    runs {
        client {
            client()
            source sourceSets.devClient
            runDir 'run'
            if (project.findProperty('fabricRoundtrip')?.toString() == 'true') {
                property 'shaderlod.dev.fabricRoundtrip', 'true'
                property 'shaderlod.dev.fabricRoundtripOriginal', project.findProperty('fabricRoundtripOriginal')?.toString() ?: ''
                if (project.findProperty('fabricRoundtripDh')?.toString() == 'true') {
                    property 'shaderlod.dev.fabricRoundtripDh', 'true'
                }
                if (project.findProperty('fabricRoundtripUi')?.toString() == 'true') {
                    property 'shaderlod.dev.fabricRoundtripUi', 'true'
                }
            }
            if (project.findProperty('fabricControl')?.toString() == 'true') {
                property 'shaderlod.dev.fabricControl', 'true'
                property 'shaderlod.dev.gpuTiming', 'false'
                property 'shaderlod.dev.cpuTiming', 'false'
            }
            if (project.findProperty('fabricSmoke')?.toString() == 'true') {
                property 'shaderlod.dev.fabricSmoke', 'true'
            }
            if (project.findProperty('fabricRendererSpeedProbe')?.toString() == 'true') {
                property 'shaderlod.dev.fabricRendererSpeedProbe', 'true'
                property 'shaderlod.experimentalFabricRenderer1211', 'true'
            }
            if (project.findProperty('fabricRendererSourceProbe')?.toString() == 'true') {
                property 'shaderlod.dev.fabricRendererSourceProbe', 'true'
                property 'shaderlod.experimentalFabricRenderer1211', 'true'
            }
            if (project.findProperty('fabricOriginalSourceProbe')?.toString() == 'true') {
                property 'shaderlod.dev.fabricOriginalSourceProbe', 'true'
                property 'shaderlod.dev.fabricOriginalSourceFamily', project.findProperty('fabricOriginalSourceFamily')?.toString() ?: ''
                property 'shaderlod.dev.fabricRoundtripOriginal', project.findProperty('fabricRoundtripOriginal')?.toString() ?: ''
            }
            if (project.hasProperty('fabricRendererSinglePhase')) {
                def phase = project.property('fabricRendererSinglePhase').toString()
                if (!(phase in ['original', 'on', 'original-return']) || project.hasProperty('fabricNativeCostControl')
                        || project.findProperty('fabricRendererSpeedProbe')?.toString() != 'true'
                        || project.findProperty('fabricRendererResearchFamily')?.toString() != 'bsl'
                        || project.findProperty('fabricRendererSourceProbe')?.toString() == 'true'
                        || project.findProperty('fabricOriginalSourceProbe')?.toString() == 'true'
                        || project.findProperty('fabricRoundtrip')?.toString() != 'true'
                        || project.findProperty('fabricRoundtripDh')?.toString() == 'true'
                        || project.findProperty('fabricRoundtripUi')?.toString() == 'true') {
                    throw new GradleException('Single BSL window requires immutable original/on/original-return phase and speed only')
                }
                property 'shaderlod.dev.fabricRendererSinglePhase', phase
            }
            if (project.hasProperty('fabricNativeCostControl')) {
                if (project.property('fabricNativeCostControl').toString() != 'true'
                        || project.findProperty('fabricRendererSpeedProbe')?.toString() != 'true'
                        || project.findProperty('fabricRendererResearchFamily')?.toString() != 'bsl'
                        || project.findProperty('fabricRendererSourceProbe')?.toString() == 'true'
                        || project.findProperty('fabricOriginalSourceProbe')?.toString() == 'true'
                        || project.findProperty('fabricRoundtrip')?.toString() != 'true'
                        || project.findProperty('fabricRoundtripDh')?.toString() == 'true'
                        || project.findProperty('fabricRoundtripUi')?.toString() == 'true') {
                    throw new GradleException('Native cost control requires explicit BSL speed roundtrip, no source/UI/DH')
                }
                property 'shaderlod.dev.fabricNativeCostControl', 'true'
            }
            if (project.hasProperty('fabricRendererResearchFamily')) {
                def family = project.property('fabricRendererResearchFamily').toString()
                def speed = project.findProperty('fabricRendererSpeedProbe')?.toString() == 'true'
                def source = project.findProperty('fabricRendererSourceProbe')?.toString() == 'true'
                if (family != 'bsl' || speed == source || project.findProperty('fabricOriginalSourceProbe')?.toString() == 'true'
                        || project.findProperty('fabricRoundtripDh')?.toString() == 'true'
                        || project.findProperty('fabricRoundtripUi')?.toString() == 'true') {
                    throw new GradleException('Named BSL research requires exactly one renderer source/speed probe, no original-only/UI/DH modes')
                }
                property 'shaderlod.dev.fabricRendererResearchFamily', 'bsl'
                property 'shaderlod.experimentalRendererResearch', 'true'
            }
        }
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test') {
    useJUnitPlatform()
    // Shared local archive fixtures are rooted at the repository, not this standalone module.
    workingDir project.projectDir.parentFile
}
tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
    from('../src/main/resources') {
        include 'assets/shaderlod/adapters/**'
        // Complete option maps consumed by the shared strict profile readers.
        include 'assets/shaderlod/astraao/options.json'
        include 'assets/shaderlod/sildurpixel/options131.json'
        include 'assets/shaderlod/solaspixel/options438.json'
        include 'assets/shaderlod/solaspixel/pbr438.json'
        include 'assets/shaderlod/*quad/**'; include 'assets/shaderlod/unbounddepth/**'; include 'assets/shaderlod/reimagineddepth/**'; include 'assets/shaderlod/photonspatial/api.json'; include 'assets/shaderlod/photonhistory/**'
        include 'shaderlod-makeup-quad.mixins.json'
        include 'shaderlod-photon-early-alpha.mixins.json'
        include 'assets/shaderlod/photonearlyalpha/**'
    }
}
tasks.named('jar') { from('../LICENSE') { into 'META-INF'; rename { 'LICENSE.shaderlod' } } }

