plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.141' }
version = '0.1.0-dev-12111'; group = 'com.pp.shaderlod'; base { archivesName = 'shaderlod-neoforge-12111' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
neoForge { version = '21.11.45'; mods { shaderlod { sourceSet sourceSets.main } }; runs { client { client(); gameDirectory = file('run') } } }
dependencies {
 compileOnly files('../runtime/iris-neoforge-1.10.8+mc1.21.11.jar')
 runtimeOnly files('../runtime/iris-neoforge-1.10.8+mc1.21.11.jar', '../runtime/sodium-neoforge-0.8.14+mc1.21.11.jar')
 testImplementation 'org.junit.jupiter:junit-jupiter:5.14.1'; testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
def shared = ['com/pp/shaderlod/ShadowFrustumCoherence.java','com/pp/shaderlod/ShadowFrustumCoherenceController.java','com/pp/shaderlod/ShadowFrustumCoherenceDiagnostics.java','com/pp/shaderlod/ShadowCullingController.java','com/pp/shaderlod/ShadowCullingMath.java','com/pp/shaderlod/GeometryLodPolicy.java', 'com/pp/shaderlod/GeometryCoverageGuard.java', 'com/pp/shaderlod/mixin/BslAo*.java', 'com/pp/shaderlod/optimization/**', 'com/pp/shaderlod/measurement/**', 'com/pp/shaderlod/CoreUniformFrame.java', 'com/pp/shaderlod/LodSettings.java',
'com/pp/shaderlod/LodPreset.java', 'com/pp/shaderlod/EffectUniformFrame.java',
'com/pp/shaderlod/lod/**', 'com/pp/shaderlod/integration/**', 'com/pp/shaderlod/packs/**',
'com/pp/shaderlod/mixin/EffectUniformsMixin.java', 'com/pp/shaderlod/mixin/IrisWorldCompletionMixin.java', 'com/pp/shaderlod/mixin/IrisOptionWriteMixin.java']
sourceSets.main.java { srcDir '../../../src/main/java'; include shared; include 'com/pp/shaderlod/**'
 exclude { !it.isDirectory() && it.file.canonicalPath.startsWith(file('../../../src/main/java').canonicalPath) && !shared.any { pattern -> org.apache.tools.ant.types.selectors.SelectorUtils.matchPath(pattern, file('../../../src/main/java').toPath().relativize(it.file.toPath()).toString()) } }
}
sourceSets.test.java { srcDir '../../../src/test/java'; include 'com/pp/shaderlod/optimization/**'; include 'com/pp/shaderlod/measurement/**'; include 'com/pp/shaderlod/CoreUniformFrameTest.java'; include 'com/pp/shaderlod/LodSettingsTest.java'; include 'com/pp/shaderlod/lod/**'; include 'com/pp/shaderlod/packs/**'; include 'com/pp/shaderlod/port/**' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test') { useJUnitPlatform(); workingDir file('../../..') }
tasks.named('jar') { from('../../../LICENSE') { into 'META-INF'; rename { 'LICENSE.shaderlod' } } }
tasks.named('processResources') { from('../../../src/main/resources') { include 'assets/shaderlod/adapters/**' } }
sourceSets.main.java.exclude { it.file.canonicalPath == file('../../../src/main/java/com/pp/shaderlod/integration/KnownRuntimeBoundary.java').canonicalPath }

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

// Dev observation sources are separate from the production artifact.
sourceSets { devClient }
sourceSets.devClient.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
sourceSets.devClient.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
neoForge.addModdingDependenciesTo(sourceSets.devClient)
neoForge.mods { shaderlod_dev { sourceSet sourceSets.devClient } }
neoForge.runs.named('client') {
 // The explicit argument follows the same lazy provider as ModDev's working directory.
 programArguments.addAll(gameDirectory.map { directory ->
  ['--gameDir', directory.asFile.absolutePath]
 })
 sourceSet = sourceSets.devClient
 loadedMods = [neoForge.mods.shaderlod, neoForge.mods.shaderlod_dev]
 if (project.hasProperty('portRunDirectory')) {
  gameDirectory = file(project.property('portRunDirectory'))
  programArguments.addAll('--username', 'ShaderLOD', '--fullscreen', '--width', '1920', '--height', '1200',
    '--quickPlaySingleplayer', 'ShaderLOD-Landscape')
 }
  systemProperty 'shaderlod.rendererSpeedPortR1', project.findProperty('portRendererSpeedCandidate')?.toString() ?: 'false'
  systemProperty 'shaderlod.dev.portRendererSpeedProbe', project.findProperty('portRendererSpeedProbe')?.toString() ?: 'false'
 if (project.findProperty('portRoundtrip')?.toString() == 'true') {
  systemProperty 'shaderlod.dev.portRoundtrip', 'true'
  systemProperty 'shaderlod.dev.portRoundtripOriginal', project.findProperty('portRoundtripOriginal')?.toString() ?: ''
  systemProperty 'shaderlod.dev.portRoundtripUi', project.findProperty('portRoundtripUi')?.toString() ?: 'false'
  systemProperty 'shaderlod.dev.portQualityRoundtrip', project.findProperty('portQualityRoundtrip')?.toString() ?: 'false'
  systemProperty 'shaderlod.dev.startupDeadlineEpochMillis', project.findProperty('portStartupDeadlineEpochMillis')?.toString() ?: '0'
 }
}

// Exact version/loader renderer replacements. Shared source/options proof stays separate.
sourceSets.main.java.exclude { it.file.canonicalPath == file('../../../src/main/java/com/pp/shaderlod/integration/makeupquad/MakeUpQuadRuntime.java').canonicalPath ||
    it.file.canonicalPath == file('../../../src/main/java/com/pp/shaderlod/integration/makeupquad/MakeUpQuadApiPins.java').canonicalPath ||
    it.file.canonicalPath == file('../../../src/main/java/com/pp/shaderlod/integration/makeupquad/mixin/MakeUpQuadMixin.java').canonicalPath }
tasks.named('processResources') { from('../../../src/main/resources') { include 'assets/shaderlod/*quad/**'; include 'assets/shaderlod/unbounddepth/**'; include 'assets/shaderlod/reimagineddepth/**'; include 'assets/shaderlod/photonspatial/api.json'; include 'assets/shaderlod/photonhistory/**' } }

// Sodium's NeoForge release is a wrapper; compile against its exact embedded mod API.
def rendererSodiumApi = tasks.register('extractRendererSodiumApi', Copy) {
    from(zipTree(file('../runtime/sodium-neoforge-0.8.14+mc1.21.11.jar'))) {
        include 'META-INF/jarjar/net.caffeinemc.sodium-neoforge-0.8.14+mc1.21.11-mod.jar'
        eachFile { path = name }
    }
    includeEmptyDirs = false
    into(layout.buildDirectory.dir('renderer-api'))
}
dependencies { compileOnly files(layout.buildDirectory.file('renderer-api/net.caffeinemc.sodium-neoforge-0.8.14+mc1.21.11-mod.jar')).builtBy(rendererSodiumApi) }

sourceSets.main.java.exclude { it.file.canonicalPath == file('../../../src/main/java/com/pp/shaderlod/integration/RasterExperimentRuntime.java').canonicalPath }

// Explicit MakeUp AO native depth ABI adapter; shared MC1.21.1 class is excluded here.
sourceSets.main.java.exclude { it.file.canonicalPath == file("../../../src/main/java/com/pp/shaderlod/optimization/makeupao/MakeUpAoDepthId.java").canonicalPath }

// Explicit BSL AO native depth ABI; common1.21.1 int-return adapter excluded.
sourceSets.main.java.exclude { it.file.canonicalPath == file("../../../src/main/java/com/pp/shaderlod/optimization/BslAoGlProof.java").canonicalPath }

// Explicit Unbound AO depth ABI: retain the typed module adapter.
sourceSets.main.java.exclude { it.file.canonicalPath == file("../../../src/main/java/com/pp/shaderlod/optimization/unbounddepth/UnboundAoDepthId.java").canonicalPath }

// Explicit Solas AO native depth ABI: retain the typed module adapter.
sourceSets.main.java.exclude { it.file.canonicalPath == file("../../../src/main/java/com/pp/shaderlod/optimization/solasdepth/SolasAoDepthId.java").canonicalPath }

// Explicit Reimagined AO native depth ABI: retain the typed module adapter.
sourceSets.main.java.exclude { it.file.canonicalPath == file("../../../src/main/java/com/pp/shaderlod/optimization/reimagineddepth/ReimaginedAoDepthId.java").canonicalPath }

// Explicit MakeUp shadow depth ABI: retain the typed module adapter.
sourceSets.main.java.exclude { it.file.canonicalPath == file("../../../src/main/java/com/pp/shaderlod/optimization/makeupshadow/MakeUpShadowDepthId.java").canonicalPath }

// The legacy createShader owner is not the selected modern ShaderCreator consumer.
sourceSets.main.java.exclude { it.file.canonicalPath == file("../../../src/main/java/com/pp/shaderlod/optimization/makeupshadow/mixin/ShadowLegacyOwnerMixin.java").canonicalPath }

// BSL exact modern resource callback replaces old no-argument common class.
def shaderlodBslReceiverCommonSource = file("../../../src/main/java/com/pp/shaderlod/optimization/bsl/mixin/BslReceiverSodiumMixin.java").canonicalPath
sourceSets.main.java.exclude { it.file.canonicalPath == shaderlodBslReceiverCommonSource }

// Exact Sildur1.21.11 producer uses typed Identifier/GpuTexture/GlSampler APIs.
def shaderlodSildurPrefixLegacySource = file("../../../src/main/java/com/pp/shaderlod/sildurprefix").canonicalPath + File.separator
sourceSets.main.java.exclude { it.file.canonicalPath.startsWith(shaderlodSildurPrefixLegacySource) }

// Only NF1.21.1 has the legacy normal early-alpha producer; typed ports remain pending.
def shaderlodMakeUpEarlyAlphaLegacySource = file("../../../src/main/java/com/pp/shaderlod/optimization/makeupearlyalpha").canonicalPath + File.separator
sourceSets.main.java.exclude { it.file.canonicalPath.startsWith(shaderlodMakeUpEarlyAlphaLegacySource) && it.file.name != 'MakeUpOpaqueAlphaSpecialization.java' }

// Exact optional DH public API compile dependency; users may run without DH.
dependencies { compileOnly files("../runtime/DistantHorizons-3.3.3-1.21.11-fabric-neoforge.jar") }

// MakeUp merged terrain first normal NF1.21.1 ABI; remaining normal adapters pending.
def shaderlodMakeUpMergedLegacySource = file("../../../src/main/java/com/pp/shaderlod/optimization/makeupmerged").canonicalPath + File.separator
sourceSets.main.java.exclude { it.file.canonicalPath.startsWith(shaderlodMakeUpMergedLegacySource) }

