def shaderlodBlissMergedLegacySource = file("../../../src/main/java/com/pp/shaderlod/optimization/blissmerged").canonicalPath + File.separator
sourceSets.main.java.exclude { it.file.canonicalPath.startsWith(shaderlodBlissMergedLegacySource) }

