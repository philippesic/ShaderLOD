<!doctype html><html lang="en"><meta charset="utf-8"><title>ShaderLOD comparison</title><style>body{background:#121720;color:white;font:16px system-ui;margin:2rem}canvas{width:100%;height:360px}pre{white-space:pre-wrap}a{color:#6bd2ff}input{width:30%}button,select{font:inherit}table{border-collapse:collapse}td,th{padding:.4rem;border:1px solid #567}</style><h1>ShaderLOD comparison</h1><p id="status"></p><p>Elapsed-time bins retain each arm and repeat. No frame-count stretching or pointwise causal subtraction. Session placement uses host command envelopes; route-relative timestamps come from application frames.</p><label>View <select id="view"><option value="route">Within-route overlay</option><option value="session">Chronological session placement</option></select></label> <label>Metric <select id="metric"><option value="fps">FPS</option><option value="ms">Mean frame interval (ms, assigned by interval end)</option></select></label><p><label>Start <input id="start" type="range" min="0" max="1000" value="0"></label><label>End <input id="end" type="range" min="0" max="1000" value="1000"></label></p><canvas id="plot" width="1600" height="360"></canvas><p id="hover"></p><div id="links"></div><h2>Four-cell interactions</h2><pre id="interactions"></pre><details><summary>Structured evidence and failures</summary><pre id="raw"></pre></details><noscript>Read result.json beside this report. JavaScript is required for the interactive graph.</noscript><script>
const result=@@DATA@@,canvas=document.getElementById('plot'),c=canvas.getContext('2d'),view=document.getElementById('view'),metric=document.getElementById('metric'),start=document.getElementById('start'),end=document.getElementById('end'),colors=['#6bd2ff','#ffad62','#8ef0af','#e9a2ed','#fff078'];document.getElementById('status').textContent=result.state+'; '+result.qualification+'; '+result.retention+'; failure: '+result.failure;document.getElementById('raw').textContent=JSON.stringify(result,null,2);document.getElementById('interactions').textContent=JSON.stringify(result.interactions||[],null,2);
const arms=[...new Set(result.observations.map(r=>r.arm))],rows=result.observations;let plotted=[],low=0,high=1;for(const row of rows){const a=document.createElement('a');a.textContent=row.case+' / '+row.arm+' / block '+row.block+' — '+(row.summary.fps===null?'invalid':row.summary.fps.toFixed(2)+' FPS')+'; selection '+(row.selection_seconds||0).toFixed(2)+' s';a.href=row.attempt+'/report.html';a.style.display='block';document.getElementById('links').append(a);if(row.quality_only){const q=document.createElement('a');q.textContent='Untimed quality sequence';q.href=row.attempt+'/quality.html';q.style.display='block';document.getElementById('links').append(q);}}
function draw(){const series=rows.map(row=>({row,points:Array.from({length:Math.ceil(row.summary.elapsed_ns/1e9)},(_,second)=>row.summary.bins.find(p=>p.second===second)||{second,frames:0,observed_interval_ns:0}).map(p=>{const duration=Math.min(1,row.summary.elapsed_ns/1e9-p.second),x=p.second+(view.value==='session'?(row.window_started_seconds||0):0),y=metric.value==='fps'?p.frames/duration:(p.frames?p.observed_interval_ns/p.frames/1e6:NaN);return [x,y];})})),maximumTime=Math.max(1,...series.flatMap(s=>s.points.map(p=>p[0]+1)));low=Math.min(+start.value,+end.value)/1000*maximumTime;high=Math.max(+start.value,+end.value)/1000*maximumTime;const maximum=Math.max(1,...series.flatMap(s=>s.points.filter(p=>p[0]>=low&&p[0]<=high).map(p=>p[1]).filter(Number.isFinite)));plotted=[];c.clearRect(0,0,1600,360);c.fillStyle='white';c.fillText(maximum.toFixed(2)+' '+(metric.value==='fps'?'FPS':'ms'),10,18);c.fillText(low.toFixed(2)+' s',10,352);c.fillText(high.toFixed(2)+' s',1480,352);for(const s of series){c.strokeStyle=colors[arms.indexOf(s.row.arm)%colors.length];c.setLineDash(s.row.block%2?[5,4]:[]);c.beginPath();let first=true;for(const p of s.points){if(p[0]<low||p[0]>high)continue;if(!Number.isFinite(p[1])){first=true;continue;}const x=40+(p[0]-low)/Math.max(.001,high-low)*1520,y=320-p[1]/maximum*280;if(first)c.moveTo(x,y);else c.lineTo(x,y);first=false;plotted.push({x,y,p,label:s.row.case+' / '+s.row.arm+' / block '+s.row.block});}c.stroke();}c.setLineDash([]);}
canvas.onmousemove=e=>{const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*1600;let nearest=null;for(const p of plotted)if(nearest===null||Math.abs(p.x-x)<Math.abs(nearest.x-x))nearest=p;document.getElementById('hover').textContent=nearest?nearest.label+'; '+nearest.p[0].toFixed(2)+' s; '+nearest.p[1].toFixed(3)+' '+metric.value:'';};for(const e of [view,metric,start,end])e.oninput=draw;draw();</script></html>
