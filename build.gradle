plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets { devClient }
sourceSets.devClient.compileClasspath += sourceSets.main.compileClasspath

configurations {
    runtimeClasspath.extendsFrom localRuntime
    devClientRuntimeClasspath.extendsFrom localRuntime
}

// Bootstrap downloads are checksum-locked in dev/runtime.lock.json.
def runtimeLock = new groovy.json.JsonSlurper().parse(file('dev/runtime.lock.json'))
def performanceStack = project.findProperty('performanceStack')?.toString() ?: 'minimal'
def optionalRuntimeFiles = []
if (performanceStack != 'minimal') {
    def optionalLockFile = file('dev/performance-mods.lock.json')
    if (!optionalLockFile.exists()) throw new GradleException('Optional performance lock missing; use the minimal stack until setup is complete.')
    def optionalLock = new groovy.json.JsonSlurper().parse(optionalLockFile)
    def selected = optionalLock.stacks[performanceStack]
    if (selected == null) throw new GradleException("Unknown performanceStack: ${performanceStack}")
    selected.each { name ->
        def artifact = optionalLock.artifacts[name]
        def jarFile = file("dev/runtime/performance/${artifact.filename}")
        if (!jarFile.exists()) throw new GradleException("Missing ${jarFile}; run python3 scripts/setup_performance_mods.py first.")
        def actualHash = java.security.MessageDigest.getInstance('SHA-256').digest(jarFile.bytes).encodeHex().toString()
        if (actualHash != artifact.hashes.sha256) throw new GradleException("Optional runtime checksum mismatch: ${jarFile}")
        optionalRuntimeFiles.add(jarFile)
    }
}
dependencies {
    devClientCompileOnly sourceSets.main.output
    compileOnly files("dev/runtime/${runtimeLock.artifacts.iris.filename}")
    compileOnly files("dev/runtime/${runtimeLock.artifacts.sodium.filename}")
    localRuntime files("dev/runtime/${runtimeLock.artifacts.iris.filename}",
                       "dev/runtime/${runtimeLock.artifacts.sodium.filename}")
    localRuntime files(optionalRuntimeFiles)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
repositories { mavenCentral() }

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            gameDirectory = project.file('run')
            jvmArgument '-Xmx4G'
        }
        clientIris {
            client()
            gameDirectory = project.file('run-iris')
            jvmArgument '-Xmx4G'
        }
        clientLodOn {
            client()
            gameDirectory = project.file('run-landscape/lod-on')
            systemProperty 'shaderlod.dev.compare', 'on'
            jvmArgument '-Xmx6G'
        }
        clientLodOff {
            client()
            gameDirectory = project.file('run-landscape/lod-off')
            systemProperty 'shaderlod.dev.compare', 'off'
            jvmArgument '-Xmx6G'
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
        configureEach {
            systemProperty 'shaderlod.dev.performanceStack', performanceStack
            if (project.hasProperty('includeDh')) {
                systemProperty 'shaderlod.dev.includeDh', project.property('includeDh').toString()
            }
            if (project.hasProperty('runDirectory')) {
                gameDirectory = project.file(project.property('runDirectory').toString())
            }
            if (project.findProperty('measureWorkload') == 'true') {
                systemProperty 'shaderlod.dev.measureWorkload', 'true'
            }
            if (project.findProperty('measureOnly') == 'true') {
                systemProperty 'shaderlod.dev.measureOnly', 'true'
            }
            if (project.hasProperty('measurementSeconds')) {
                systemProperty 'shaderlod.dev.measurementSeconds', project.property('measurementSeconds').toString()
            }
            if (project.hasProperty('fixedWetness')) {
                systemProperty 'shaderlod.dev.fixedWetness', project.property('fixedWetness').toString()
            }
            if (project.hasProperty('shadowObserve')) {
                systemProperty 'shaderlod.dev.shadowObserve', project.property('shadowObserve').toString()
            }
            if (project.hasProperty('visibilityLists')) {
                systemProperty 'shaderlod.dev.visibilityLists', project.property('visibilityLists').toString()
            }
            if (project.hasProperty('shadowCoherenceOracle')) {
                systemProperty 'shaderlod.dev.shadowCoherenceOracle', project.property('shadowCoherenceOracle').toString()
            }
            if (project.hasProperty('jfrRecording')) {
                def recording = project.file(project.property('jfrRecording').toString()).absolutePath
                jvmArgument "-XX:StartFlightRecording=name=shaderlod-render,settings=profile,dumponexit=true,maxsize=256m,filename=${recording}"
            }
            if (project.hasProperty('gpuAttribution')) {
                systemProperty 'shaderlod.dev.gpuAttribution', project.property('gpuAttribution').toString()
            }
            if (project.hasProperty('gpuTiming')) {
                systemProperty 'shaderlod.dev.gpuTiming', project.property('gpuTiming').toString()
            }
            if (project.hasProperty('gpuSampleInterval')) {
                systemProperty 'shaderlod.dev.gpuSampleInterval', project.property('gpuSampleInterval').toString()
            }
            if (project.hasProperty('benchmarkWindowScale')) {
                systemProperty 'shaderlod.dev.benchmarkWindowScale', project.property('benchmarkWindowScale').toString()
            }
            if (project.hasProperty('cpuLayerTiming')) {
                systemProperty 'shaderlod.dev.cpuLayerTiming', project.property('cpuLayerTiming').toString()
            }
            if (project.findProperty('smokeTest') == 'true') {
                systemProperty 'shaderlod.dev.smoke', 'true'
            }
            if (project.findProperty('gpuBenchmark') == 'true') {
                systemProperty 'shaderlod.dev.benchmark', 'true'
            }
            if (project.findProperty('benchmarkOnly') == 'true') {
                systemProperty 'shaderlod.dev.benchmarkOnly', 'true'
            }
            for (name in ['benchmarkSettleSeconds', 'benchmarkStartEnabled', 'benchmarkFeature']) {
                if (project.hasProperty(name)) {
                    systemProperty "shaderlod.dev.${name}", project.property(name).toString()
                }
            }
            if (project.hasProperty('gpuPassTiming')) {
                systemProperty 'shaderlod.dev.gpuPassTiming', project.property('gpuPassTiming').toString()
            }
            if (project.hasProperty('initialWarmup')) {
                systemProperty 'shaderlod.dev.initialWarmup', project.property('initialWarmup').toString()
            }
        }
    }
    mods {
        shaderlod { sourceSet(sourceSets.main) }
        shaderlod_dev { sourceSet(sourceSets.devClient) }
    }
}
// Runtime directories own DH; never silently move a user's mod files to change a benchmark.
['runClientLodOn', 'runClientLodOff'].each { taskName ->
    def defaultDirectory = taskName == 'runClientLodOn' ? 'run-landscape/lod-on' : 'run-landscape/lod-off'
    def profile = file(project.findProperty('runDirectory')?.toString() ?: defaultDirectory)
    def dhFilename = runtimeLock.artifacts.distanthorizons.filename
    def dhJar = new File(profile, "mods/${dhFilename}")
    def expectedDh = project.findProperty('includeDh')?.toString() != 'false'
    tasks.named(taskName).configure {
        doFirst {
            if (dhJar.exists() != expectedDh) throw new GradleException("DH presence disagrees with includeDh=${expectedDh} in ${profile}")
            if (new File(profile, 'mods').exists()) {
                def unmanaged = new File(profile, 'mods').listFiles().findAll { it.name.endsWith('.jar') && it.name != dhFilename }
                if (!unmanaged.empty) throw new GradleException("Unmanaged profile mod jars would contaminate performanceStack=${performanceStack}: ${unmanaged*.name}")
            }
        }
    }
}
neoForge.addModdingDependenciesTo(sourceSets.devClient)
neoForge.runs.named('clientLodOff') {
    sourceSet = sourceSets.devClient
    loadedMods = [neoForge.mods.shaderlod_dev]
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def properties = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                      mod_license: mod_license, minecraft_version_range: minecraft_version_range,
                      neo_version: neo_version]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test') { useJUnitPlatform() }
tasks.named('jar') {
    from('LICENSE') { into 'META-INF'; rename { 'LICENSE.shaderlod' } }
}
idea { module { downloadSources = true } }
