def shaderlodAstraPrimeLegacySource = file("../../../src/main/java/com/pp/shaderlod/optimization/astraprime").canonicalPath + File.separator
sourceSets.main.java.exclude { it.file.canonicalPath.startsWith(shaderlodAstraPrimeLegacySource) }


