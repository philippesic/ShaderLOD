def shaderlodBslMergedLegacySource = file("../../../src/main/java/com/pp/shaderlod/optimization/bslmerged").canonicalPath + File.separator
sourceSets.main.java.exclude { it.file.canonicalPath.startsWith(shaderlodBslMergedLegacySource) }

