plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
// Dependency-neutral clocks, analysis and result contract are shared even when
// the production mod is absent from a developer baseline.
sourceSets { benchmarkCore; devClient; pcControl }
sourceSets.devClient.compileClasspath += sourceSets.main.compileClasspath
sourceSets.pcControl.compileClasspath += sourceSets.main.compileClasspath
// Lightweight effect config/command integration tests need the pinned main APIs.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath
// Standalone cross-port probe requires its bindingcompat target sources;
// it is not a JUnit test or a root NeoForge1.21.1 consumer.
sourceSets.test.java.exclude('com/pp/shaderlod/optimization/BindingSliceChecksMain.java')
// Prototype API/tests belong to this NeoForge1.21.1 module, not shared port tests.
sourceSets.test.java.srcDir('src/neoforge1211Test/java')

configurations {
    runtimeClasspath.extendsFrom localRuntime
    devClientRuntimeClasspath.extendsFrom localRuntime
}

// Bootstrap downloads are checksum-locked in dependencies/runtime.lock.json.
def runtimeLock = new groovy.json.JsonSlurper().parse(file('dependencies/runtime.lock.json'))
def performanceStack = project.findProperty('performanceStack')?.toString() ?: 'minimal'
def optionalRuntimeFiles = []
if (performanceStack != 'minimal') {
    def optionalLockFile = file('dependencies/performance-mods.lock.json')
    if (!optionalLockFile.exists()) throw new GradleException('Optional performance lock missing; use the minimal stack until setup is complete.')
    def optionalLock = new groovy.json.JsonSlurper().parse(optionalLockFile)
    def selected = optionalLock.stacks[performanceStack]
    if (selected == null) throw new GradleException("Unknown performanceStack: ${performanceStack}")
    selected.each { name ->
        def artifact = optionalLock.artifacts[name]
        def jarFile = file("dependencies/runtime/performance/${artifact.filename}")
        if (!jarFile.exists()) throw new GradleException("Missing ${jarFile}; run python3 scripts/setup_performance_mods.py first.")
        def actualHash = java.security.MessageDigest.getInstance('SHA-256').digest(jarFile.bytes).encodeHex().toString()
        if (actualHash != artifact.hashes.sha256) throw new GradleException("Optional runtime checksum mismatch: ${jarFile}")
        optionalRuntimeFiles.add(jarFile)
    }
}
dependencies {
    implementation sourceSets.benchmarkCore.output
    devClientImplementation sourceSets.benchmarkCore.output
    pcControlImplementation sourceSets.benchmarkCore.output
    testImplementation sourceSets.benchmarkCore.output
    devClientCompileOnly sourceSets.main.output
    pcControlCompileOnly sourceSets.main.output
    compileOnly files("dependencies/runtime/${runtimeLock.artifacts.iris.filename}")
    compileOnly files("dependencies/runtime/${runtimeLock.artifacts.sodium.filename}")
    devClientCompileOnly('org.anarres:jcpp:1.4.14') { transitive = false }
    localRuntime files("dependencies/runtime/${runtimeLock.artifacts.iris.filename}",
                       "dependencies/runtime/${runtimeLock.artifacts.sodium.filename}")
    localRuntime files(optionalRuntimeFiles)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Native-memory consumer tests use Minecraft 1.21.1's pinned LWJGL version.
    def testOs = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    def testArm = System.getProperty('os.arch') in ['aarch64', 'arm64']
    def testPlatform = testOs.contains('mac') ? 'macos' : testOs.contains('windows') ? 'windows' : 'linux'
    def testNatives = 'natives-' + testPlatform + (testArm ? '-arm64' : '')
    if (testPlatform == 'linux' && testArm) {
        // The Minecraft repository owns this module's metadata but omits the
        // ARM classifier. Reuse the separately checksum-locked native archive.
        testRuntimeOnly files('dependencies/runtime/linux-arm64/lwjgl-3.3.3-natives-linux-arm64.jar')
    } else {
        testRuntimeOnly "org.lwjgl:lwjgl:3.3.3:${testNatives}"
    }

    // Standalone tests exercise the actual Iris preprocessor without FML's nested-JAR loader.
    testRuntimeOnly('org.anarres:jcpp:1.4.14') { transitive = false }
}
repositories { mavenCentral() }
apply from: 'gradle/linux-arm64.gradle'

