def shaderlodReimaginedEarlyAlphaLegacySource = file("../../../src/main/java/com/pp/shaderlod/optimization/reimaginedearlyalpha").canonicalPath + File.separator
sourceSets.main.java.exclude { it.file.canonicalPath.startsWith(shaderlodReimaginedEarlyAlphaLegacySource) && it.file.name != 'ReimaginedCompilationInputs.java' }

