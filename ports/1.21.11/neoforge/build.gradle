def shaderlodUnboundPrimeLegacySource = file("../../../src/main/java/com/pp/shaderlod/optimization/unboundprime").canonicalPath + File.separator
sourceSets.main.java.exclude { it.file.canonicalPath.startsWith(shaderlodUnboundPrimeLegacySource) }

