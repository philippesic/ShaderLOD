def shaderlodMakeUpPrimeLegacySource = file("../../../src/main/java/com/pp/shaderlod/optimization/makeupprime").canonicalPath + File.separator
sourceSets.main.java.exclude { it.file.canonicalPath.startsWith(shaderlodMakeUpPrimeLegacySource) }

