def shaderlodSolasPrimeLegacySource = file("../../../src/main/java/com/pp/shaderlod/optimization/solasprime").canonicalPath + File.separator
sourceSets.main.java.exclude { it.file.canonicalPath.startsWith(shaderlodSolasPrimeLegacySource) }

