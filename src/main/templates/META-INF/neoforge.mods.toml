modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''Distance-based shader quality experiments for Iris and Photon.'''

[[dependencies.shaderlod]]
modId="neoforge"
type="required"
versionRange="[${neo_version},21.2)"
ordering="NONE"
side="CLIENT"

[[dependencies.shaderlod]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"

# This internal uniform hook is audited against exactly this Iris patch line.
[[dependencies.shaderlod]]
modId="iris"
type="required"
versionRange="[1.8.12,1.8.13)"
ordering="AFTER"
side="CLIENT"

[[dependencies.shaderlod]]
modId="sodium"
type="required"
versionRange="[0.6.13,0.7)"
ordering="AFTER"
side="CLIENT"

[[dependencies.shaderlod]]
modId="distanthorizons"
type="optional"
versionRange="[3.3.3,3.3.4)"
ordering="AFTER"
side="CLIENT"

[[mixins]]
config="shaderlod.mixins.json"
